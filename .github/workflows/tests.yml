name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      # eval/tool_sandbox.py runs model-written tools under Bubblewrap and refuses without it. Ubuntu 24.04
      # restricts unprivileged user namespaces through AppArmor, and bwrap needs them.
      - run: |
          sudo apt-get update -q && sudo apt-get install -yq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # No IDO toolchain, ROM, knowledge base or game-derived fixtures on a runner.
      # Tests that need them skip and print why (-rs); everything else must pass.
      - run: python -m pytest -q -rfEs
